<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="matF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Staggered Mats for 4 Family Members in living room -->
  <!-- Back row: Two Adult Caregivers -->
  <polygon points="1060,680 1320,680 1280,800 1000,800" fill="url(#matF)" stroke="#C5A880" stroke-opacity="0.3" stroke-width="1.5"/>
  <polygon points="1380,680 1640,680 1600,800 1320,800" fill="url(#matF)" stroke="#C5A880" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Front row: Two Kids / Teens -->
  <polygon points="980,820 1260,820 1200,950 900,950" fill="url(#matF)" stroke="#C5A880" stroke-opacity="0.35" stroke-width="2"/>
  <polygon points="1320,820 1600,820 1540,950 1240,950" fill="url(#matF)" stroke="#C5A880" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Laptop on wide stand framing all 4 mats -->
  <g transform="translate(820, 750)">
    <line x1="40" y1="50" x2="40" y2="100" stroke="#78716c" stroke-width="4"/>
    <line x1="15" y1="100" x2="65" y2="100" stroke="#78716c" stroke-width="4"/>
    <polygon points="5,50 75,50 70,60 10,60" fill="#44403c"/>
    <polygon points="10,50 70,50 65,10 15,10" fill="#292524" stroke="#a8a29e" stroke-width="2"/>
    <rect x="20" y="16" width="40" height="30" rx="2" fill="#0284c7" fill-opacity="0.35"/>
    <!-- Teacher tile + 4 mini tiles -->
    <circle cx="40" cy="24" r="5" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="55" cy="18" r="2" fill="#22c55e"/>
  </g>

  <!-- Participant 1: Adult Caregiver (Seated spine stretch / namaste) -->
  <g transform="translate(1140, 610)" fill="#d6d3d1" fill-opacity="0.65">
    <circle cx="20" cy="-45" r="18"/>
    <path d="M10,-25 C14,-5 16,40 14,75 C28,75 32,-5 30,-25 Z"/>
    <path d="M5,75 C-15,90 -25,110 -35,125 C-15,130 15,110 35,110 C55,110 85,130 105,125 C95,110 85,90 65,75 Z"/>
  </g>

  <!-- Participant 2: Second Adult Caregiver (Gentle side reach) -->
  <g transform="translate(1460, 610)" fill="#e7e5e4" fill-opacity="0.65">
    <circle cx="20" cy="-45" r="18"/>
    <path d="M10,-25 C14,-5 16,40 14,75 C28,75 32,-5 30,-25 Z"/>
    <path d="M5,75 C-15,90 -25,110 -35,125 C-15,130 15,110 35,110 C55,110 85,130 105,125 C95,110 85,90 65,75 Z"/>
  </g>

  <!-- Participant 3: School-age Child (Seated butterfly / happy pose) -->
  <g transform="translate(1080, 770)" fill="#f5f5f4" fill-opacity="0.75">
    <circle cx="16" cy="-35" r="14"/>
    <path d="M8,-18 C11,-2 13,30 11,55 C22,55 25,-2 23,-18 Z"/>
    <path d="M2,55 C-12,65 -20,80 -28,95 C-12,100 12,85 28,85 C44,85 68,100 84,95 C76,80 68,65 52,55 Z"/>
  </g>

  <!-- Participant 4: Teen / Younger Child (Cross-legged calm stretch) -->
  <g transform="translate(1420, 770)" fill="#f5f5f4" fill-opacity="0.75">
    <circle cx="16" cy="-35" r="14"/>
    <path d="M8,-18 C11,-2 13,30 11,55 C22,55 25,-2 23,-18 Z"/>
    <path d="M2,55 C-12,65 -20,80 -28,95 C-12,100 12,85 28,85 C44,85 68,100 84,95 C76,80 68,65 52,55 Z"/>
  </g>

  <!-- Concept Placeholder Label Card -->
  <g transform="translate(1080, 240)">
    <rect width="720" height="230" rx="16" fill="#1c1917" fill-opacity="0.85" stroke="#C5A880" stroke-width="1.5"/>
    <rect x="30" y="30" width="380" height="32" rx="16" fill="#C5A880" fill-opacity="0.15" stroke="#C5A880" stroke-opacity="0.5"/>
    <text x="50" y="51" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.15em" fill="#C5A880">
      CONCEPT PREVIEW · FILE 13 SHOT PLAN
    </text>
    <text x="30" y="100" font-family="system-ui, Georgia, serif" font-size="24" font-weight="600" fill="#f5f5f4">
      Online Family Yoga (Up to Four)
    </text>
    <text x="30" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e">
      • Composition: Four household participants on staggered mats (2 adults, 2 kids)
    </text>
    <text x="30" y="160" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e">
      • Authentic framing: Participating adult caregiver + room framing (NOT handstands)
    </text>
    <text x="30" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78716c">
      * Candidate preview visual — real family session asset to replace upon photoshoot
    </text>
  </g>
</svg>
