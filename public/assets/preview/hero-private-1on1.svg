<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="50%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#C5A880" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Yoga Mat Perspective (Right-Center composition for copy space on left) -->
  <polygon points="1050,780 1620,780 1560,940 950,940" fill="url(#mat)" stroke="#C5A880" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Laptop on Stand facing the mat -->
  <g transform="translate(900, 710)">
    <!-- Stand -->
    <line x1="50" y1="60" x2="50" y2="110" stroke="#78716c" stroke-width="4"/>
    <line x1="20" y1="110" x2="80" y2="110" stroke="#78716c" stroke-width="4"/>
    <!-- Laptop Base -->
    <polygon points="10,60 90,60 85,70 15,70" fill="#44403c"/>
    <!-- Screen -->
    <polygon points="15,60 85,60 80,10 20,10" fill="#292524" stroke="#a8a29e" stroke-width="2"/>
    <!-- Screen Glow (Live Video Call) -->
    <rect x="25" y="16" width="50" height="38" rx="2" fill="#0284c7" fill-opacity="0.35"/>
    <circle cx="50" cy="30" r="8" fill="#38bdf8" fill-opacity="0.8"/>
    <!-- Live Dot -->
    <circle cx="70" cy="18" r="2.5" fill="#22c55e"/>
  </g>

  <!-- Student Silhouette (Peaceful seated alignment/lunge on mat) -->
  <g transform="translate(1260, 640)" fill="#d6d3d1" fill-opacity="0.65">
    <!-- Head -->
    <circle cx="30" cy="-60" r="22"/>
    <!-- Torso aligned -->
    <path d="M15,-35 C20,-10 22,50 18,90 C40,90 48,-10 45,-35 Z"/>
    <!-- Gentle arm extension -->
    <path d="M18,-20 C-5,-5 -25,20 -40,45 C-36,50 -20,30 20,-10 Z"/>
    <path d="M42,-20 C65,-5 85,20 100,45 C96,50 80,30 40,-10 Z"/>
    <!-- Folded legs / seated base -->
    <path d="M-50,90 C-30,60 10,75 30,90 C50,75 90,60 110,90 C80,120 -20,120 -50,90 Z"/>
  </g>

  <!-- Camera field of view angle lines -->
  <path d="M950,735 L1200,600 M950,755 L1450,880" stroke="#38bdf8" stroke-dasharray="6,6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Concept Placeholder Label Card (Prominent & Clear) -->
  <g transform="translate(1080, 240)">
    <rect width="720" height="230" rx="16" fill="#1c1917" fill-opacity="0.85" stroke="#C5A880" stroke-width="1.5"/>
    <!-- Badge -->
    <rect x="30" y="30" width="360" height="32" rx="16" fill="#C5A880" fill-opacity="0.15" stroke="#C5A880" stroke-opacity="0.5"/>
    <text x="50" y="51" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.15em" fill="#C5A880">
      CONCEPT PREVIEW · FILE 13 SHOT PLAN
    </text>
    <text x="30" y="100" font-family="system-ui, Georgia, serif" font-size="24" font-weight="600" fill="#f5f5f4">
      Private 1-on-1 Online Yoga
    </text>
    <text x="30" y="135" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e">
      • Composition: One adult student on mat, 3/4 angle, full body visible
    </text>
    <text x="30" y="160" font-family="system-ui, sans-serif" font-size="14" fill="#a8a29e">
      • Setup: Laptop on stable stand facing mat with live teacher call
    </text>
    <text x="30" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#78716c">
      * Candidate preview visual — real student/teacher photo to replace upon photoshoot
    </text>
  </g>
</svg>
